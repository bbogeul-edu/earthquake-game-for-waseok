<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>지진해일에서 살아남기</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=Gowun+Dodum&display=swap">
<style>
/* =========================================================
   1) 색과 글꼴 (디자인 토큰)
   게임은 '바닷가 저녁 하늘' 느낌의 어두운 화면 하나로 고정했어요.
   ========================================================= */
:root{
  color-scheme: dark;
  --ink:#0b1626;          /* 가장 어두운 바탕 */
  --glass:rgba(12,24,42,.84); /* 말풍선 유리판 */
  --line:rgba(214,232,255,.16);
  --paper:#f6f1e4;        /* 밝은 글자 / 선택지 바탕 */
  --paper-ink:#1b2433;    /* 선택지 글자 */
  --muted:#a9b8cc;
  --go:#14a06a;           /* 대피 표지판 초록 */
  --go-ink:#eafff4;
  --heart:#ff5a6e;
  --warn:#ffcf4a;
  --display:"Jua","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --body:"Gowun Dodum","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
}
html,body{height:100%;margin:0;overflow:hidden}
body{background:var(--ink);color:var(--paper);font-family:var(--body);-webkit-tap-highlight-color:transparent;user-select:none}
button,input,select{font:inherit}
button{cursor:pointer}

/* =========================================================
   2) 무대(배경) — 배경 그림 두 장을 겹쳐서 부드럽게 바꿔요
   ========================================================= */
#stage{position:fixed;inset:0;overflow:hidden;background:var(--ink)}
.bg{position:absolute;inset:-3%;opacity:0;transition:opacity .9s ease;background-size:cover;background-position:center}
.bg.on{opacity:1}
.bg svg{width:100%;height:100%;display:block}
.pic{position:absolute;left:0;top:50%;transform:translateY(-50%)}
.bobw,.kb{position:absolute;inset:0}
.kb img,.kb canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.kb{animation:kb 28s ease-in-out infinite alternate}
.kb.fast{animation-duration:9s}
.bobw.bob{animation:bob .95s ease-in-out infinite}
@keyframes kb{from{transform:scale(1.02)}to{transform:scale(1.11)}}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-.45%)}}
#vignette{position:absolute;inset:0;pointer-events:none;
  background:radial-gradient(ellipse at 50% 40%,transparent 45%,rgba(5,10,20,.55) 100%),
             linear-gradient(to bottom,rgba(5,10,20,.35),transparent 18%,transparent 52%,rgba(5,10,20,.82))}
#stage.shake .bg{animation:shake .32s infinite}
#stage.tremble .bg{animation:shake .3s 3}
#stage.slow .bg{filter:blur(2px) saturate(.6) brightness(.85);transition:filter 1s}
@keyframes shake{0%,100%{transform:translate(0,0)}25%{transform:translate(-10px,4px)}50%{transform:translate(8px,-5px)}75%{transform:translate(-6px,-3px)}}
#wave{position:absolute;left:-10%;right:-10%;bottom:-110%;height:110%;pointer-events:none;
  background:linear-gradient(to top,#0d3b5c 0%,#1e6f96 55%,rgba(220,245,255,.85) 92%,rgba(255,255,255,0) 100%)}
#wave.go{animation:wave 2.6s ease-in-out}
@keyframes wave{0%{bottom:-110%}45%{bottom:-25%}60%{bottom:-25%}100%{bottom:-110%}}
#flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none}
#flash.go{animation:flash 2s ease}
@keyframes flash{0%{opacity:0}25%{opacity:1}55%{opacity:1}100%{opacity:0}}

/* =========================================================
   3) 위쪽 막대: 장 이름, 하트, 읽어주기
   ========================================================= */
#hud{position:fixed;top:0;left:0;right:0;display:flex;align-items:center;gap:12px;justify-content:space-between;
  padding:calc(env(safe-area-inset-top,0px) + 12px) 16px 12px;z-index:5;pointer-events:none}
#hud > *{pointer-events:auto}
#chLabelOld{font-family:var(--display);font-size:1.05rem;letter-spacing:.02em;background:var(--glass);border:1px solid var(--line);
  padding:8px 14px;border-radius:999px;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hud-right{display:flex;gap:10px;align-items:center}
#prog{background:var(--glass);border:1px solid var(--line);border-radius:16px;padding:8px 14px 10px;width:min(300px,38vw);min-width:0}
#prog .pl{display:flex;gap:8px;align-items:baseline;font-family:var(--display);white-space:nowrap;overflow:hidden}
#prog .pl b{font-weight:400;color:var(--warn);font-size:1.05rem}
#prog .pl span{font-size:.95rem;overflow:hidden;text-overflow:ellipsis;min-width:0}
#prog .pl em{font-style:normal;color:var(--muted);font-size:.8rem;margin-left:auto}
.pbar{position:relative;height:9px;border-radius:999px;background:rgba(255,255,255,.14);margin-top:6px;overflow:hidden}
.pbar i{position:absolute;left:0;top:0;bottom:0;width:0;border-radius:999px;background:linear-gradient(90deg,var(--go),#5fd3a0);transition:width .6s ease}
.pbar .ticks{position:absolute;inset:0;background:repeating-linear-gradient(90deg,transparent 0 calc(12.5% - 1px),rgba(11,22,38,.85) calc(12.5% - 1px) 12.5%)}
.nav{display:flex;gap:6px}
.round:disabled{opacity:.35;cursor:default}
#skipBtn.on{background:var(--go);color:var(--go-ink)}
.menu-panel{display:flex;flex-direction:column;gap:12px;text-align:center}
.ghost-btn{background:transparent;border:1px solid var(--line);color:var(--paper);border-radius:14px;padding:13px;font-family:var(--display);font-size:1.1rem}
.ver{position:fixed;right:12px;bottom:calc(env(safe-area-inset-bottom,0px) + 8px);font-family:var(--display);font-size:.8rem;color:var(--muted);z-index:11}
#hearts{display:flex;gap:4px;background:var(--glass);border:1px solid var(--line);padding:7px 12px;border-radius:999px}
#hearts svg{width:26px;height:26px;transition:transform .3s}
#hearts svg.lost path{fill:#3a4558}
#hearts svg.pop{animation:pop .7s}
@keyframes pop{0%{transform:scale(1)}30%{transform:scale(1.5) rotate(-10deg)}100%{transform:scale(1)}}
.round{background:var(--glass);border:1px solid var(--line);color:var(--paper);border-radius:999px;padding:8px 14px;font-family:var(--display);font-size:.95rem;display:flex;gap:6px;align-items:center}
.round[aria-pressed="false"]{color:var(--muted)}
.round[aria-pressed="false"] .w{display:none}

/* =========================================================
   4) 아래쪽: 선택지 + 말풍선
   ========================================================= */
#bottom{position:fixed;left:0;right:0;bottom:0;z-index:4;padding:0 16px calc(env(safe-area-inset-bottom,0px) + 16px);
  display:flex;flex-direction:column;align-items:center;gap:12px}
#bottom > *{width:100%;max-width:880px}
#choices{display:flex;flex-direction:column;gap:10px}
#choices[hidden]{display:none!important}
.q{font-family:var(--display);font-size:1.25rem;text-align:center;text-wrap:balance;text-shadow:0 2px 8px rgba(0,0,0,.6)}
.opt{background:var(--paper);color:var(--paper-ink);border:0;border-radius:16px;padding:16px 18px;text-align:left;
  font-size:1.15rem;line-height:1.45;box-shadow:0 6px 18px rgba(0,0,0,.35);display:flex;gap:12px;align-items:flex-start;
  transition:transform .12s, background .2s;animation:rise .35s both}
.opt:active{transform:scale(.98)}
.opt .num{flex:none;width:30px;height:30px;border-radius:50%;background:var(--paper-ink);color:var(--paper);
  font-family:var(--display);display:grid;place-items:center;font-size:1rem}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.hint{align-self:center;background:transparent;border:2px dashed rgba(234,255,244,.55);color:var(--go-ink);border-radius:999px;
  padding:9px 18px;font-family:var(--display);font-size:1rem}
.timer{height:12px;border-radius:999px;background:rgba(255,255,255,.15);overflow:hidden}
.timer i{display:block;height:100%;background:linear-gradient(90deg,var(--heart),var(--warn));transform-origin:left}

#dialog{background:var(--glass);border:1px solid var(--line);border-radius:20px;padding:16px 18px 14px;
  display:flex;gap:14px;align-items:flex-start;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);min-height:96px;cursor:pointer}
#dialog[hidden]{display:none!important}
.ava{flex:none;width:76px;height:76px;overflow:hidden;border-radius:50%;display:grid;place-items:center;font-family:var(--display);
  font-size:1.5rem;color:#fff;border:3px solid rgba(255,255,255,.85);box-shadow:0 3px 10px rgba(0,0,0,.4)}
.ava.none{display:none}
.ava img{width:100%;height:100%;object-fit:cover;display:block}
.ava.pop{animation:avapop .35s ease-out}
@keyframes avapop{0%{transform:scale(.8)}60%{transform:scale(1.08)}100%{transform:scale(1)}}
.say{min-width:0;flex:1}
.who{font-family:var(--display);font-size:1.05rem;margin-bottom:2px}
.dir{font-size:.9rem;color:var(--muted);margin-bottom:2px}
.txt{font-size:1.28rem;line-height:1.6;word-break:keep-all;overflow-wrap:anywhere}
.narr .txt{font-style:normal;color:#e6edf7}
.next{font-family:var(--display);font-size:.85rem;color:var(--muted);text-align:right;margin-top:4px;opacity:0;transition:opacity .2s}
.next.on{opacity:1;animation:blink 1.4s infinite}
@keyframes blink{50%{opacity:.35}}

/* =========================================================
   5) 덮개 화면 (시작, 장 제목, 피드백, 카드뉴스, 게임 엔드, 엔딩)
   ========================================================= */
.cover{position:fixed;inset:0;z-index:10;display:grid;place-items:center;padding:calc(env(safe-area-inset-top,0px) + 16px) 16px calc(env(safe-area-inset-bottom,0px) + 16px);
  background:rgba(6,12,24,.62);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);overflow-y:auto}
.cover[hidden]{display:none!important}
.panel{width:100%;max-width:560px;background:var(--glass);border:1px solid var(--line);border-radius:24px;padding:26px 24px;
  box-shadow:0 20px 60px rgba(0,0,0,.5);animation:rise .4s both}
.big-btn{width:100%;border:0;border-radius:16px;padding:16px;font-family:var(--display);font-size:1.3rem;background:var(--go);color:var(--go-ink);
  box-shadow:0 6px 0 #0b6b46;margin-top:6px}
.big-btn:disabled{opacity:.5;cursor:default}
.big-btn:active{transform:translateY(3px);box-shadow:0 3px 0 #0b6b46}
.big-btn.red{background:#e2465b;box-shadow:0 6px 0 #9c2638;color:#fff}

/* 시작 화면 */
#start .panel{max-width:520px}
.kicker{font-family:var(--display);color:var(--warn);letter-spacing:.08em;font-size:.95rem;text-align:center}
h1{font-family:var(--display);font-weight:400;font-size:clamp(2rem,7vw,3rem);line-height:1.15;text-align:center;margin:.2em 0 .5em;text-wrap:balance}
h1 span{color:#7fd3ff}
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:14px}
.field label{font-family:var(--display);font-size:1rem;color:var(--muted)}
.field input,.field select{background:rgba(255,255,255,.95);color:var(--paper-ink);border:0;border-radius:12px;padding:13px 14px;font-size:1.2rem;min-width:0}
.row{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
.row .field{min-width:0}
.school{background:rgba(255,255,255,.12)!important;color:var(--paper)!important}
.err{color:#ffb3bd;font-size:.95rem;min-height:1.3em;margin:-6px 0 8px}
.tts-row{display:flex;align-items:center;justify-content:space-between;margin:4px 0 14px;font-family:var(--display)}
.switch{width:58px;height:32px;border-radius:999px;border:0;background:#45516a;position:relative;transition:background .2s}
.switch::after{content:"";position:absolute;top:4px;left:4px;width:24px;height:24px;border-radius:50%;background:#fff;transition:left .2s}
.switch[aria-pressed="true"]{background:var(--go)}
.switch[aria-pressed="true"]::after{left:30px}

/* 장 제목 */
#chapter{background:rgba(6,12,24,.78)}
#chapter .inner{text-align:center;animation:rise .5s both}
#chapter .n{font-family:var(--display);color:var(--warn);font-size:1.3rem;letter-spacing:.1em}
#chapter .t{font-family:var(--display);font-size:clamp(2.2rem,8vw,3.6rem);line-height:1.2;text-wrap:balance}
#chapter .s{color:var(--muted);margin-top:10px;font-family:var(--display)}

/* 피드백 / 게임 엔드 */
.fb-title{font-family:var(--display);font-size:1.9rem;color:#ffb3bd;text-align:center;margin:0 0 6px}
.fb-heart{display:flex;justify-content:center;margin-bottom:8px}
.fb-heart svg{width:58px;height:58px;animation:pop .8s}
.lesson{background:rgba(255,255,255,.08);border-left:5px solid var(--warn);border-radius:10px;padding:14px 16px;font-size:1.22rem;line-height:1.6;margin:10px 0 18px;word-break:keep-all}
.lesson b{font-family:var(--display);font-weight:400;color:var(--warn);display:block;font-size:1rem;margin-bottom:2px}

/* 행정안전부 카드뉴스 */
.card{max-width:560px;width:100%;background:#fffdf7;color:#1d2533;border-radius:22px;overflow:hidden;box-shadow:0 24px 70px rgba(0,0,0,.55);animation:rise .4s both}
.card-top{background:#0f7a55;color:#fff;padding:14px 20px;display:flex;justify-content:space-between;align-items:center;gap:10px;font-family:var(--display)}
.card-top .chip{background:rgba(255,255,255,.18);border-radius:999px;padding:4px 10px;font-size:.85rem;white-space:nowrap}
.card-top .kind{font-size:.95rem;min-width:0}
.card-body{padding:20px 22px 8px}
.card-body h3{font-family:var(--display);font-weight:400;font-size:1.7rem;line-height:1.25;margin:0 0 12px;color:#0b5c41;text-wrap:balance}
.card-body img{width:100%;border-radius:12px;margin-bottom:12px;display:block}
.card-body ul{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:10px}
.card-body li{font-size:1.18rem;line-height:1.55;padding-left:30px;position:relative;word-break:keep-all}
.card-body li::before{content:"";position:absolute;left:4px;top:.45em;width:14px;height:14px;border-radius:4px;background:#14a06a}
.card-body li.emph{background:#fff1b8;border-radius:8px;padding:6px 10px 6px 34px;font-weight:700}
.card-body li.emph::before{left:10px;top:.75em}
.card-foot{padding:10px 22px 20px;display:flex;flex-direction:column;gap:8px}
.card-foot small{color:#5e6b7d;font-size:.85rem}
.card .big-btn{margin-top:0}

/* 엔딩 */
#ending .panel{max-width:600px;text-align:center}
.medal{width:96px;height:96px;margin:0 auto 6px;display:block}
.title-badge{font-family:var(--display);font-size:clamp(1.8rem,6vw,2.4rem);color:var(--warn);margin:0}
.who-line{color:var(--muted);margin:4px 0 14px}
.score-box{background:rgba(255,255,255,.07);border:1px solid var(--line);border-radius:18px;padding:16px;margin-bottom:16px;display:flex;flex-direction:column;gap:10px}
.score-big{font-family:var(--display);font-size:2.4rem;color:var(--paper);font-variant-numeric:tabular-nums}
.score-big span{color:var(--warn)}
.score-parts{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}
.score-parts span{background:rgba(255,255,255,.1);border-radius:999px;padding:5px 11px;font-size:.92rem;font-variant-numeric:tabular-nums}
.score-parts .plus{color:#9ff0c8}.score-parts .minus{color:#ffb3bd}
.nick-row{display:flex;gap:8px;flex-wrap:wrap}
.nick-row input{flex:1 1 160px;min-width:0;background:rgba(255,255,255,.95);color:var(--paper-ink);border:0;border-radius:12px;padding:12px 14px;font-size:1.1rem}
.nick-row .big-btn{width:auto;flex:1 1 140px;margin:0;font-size:1.1rem;padding:12px}
.nick-msg{min-height:1.2em;font-size:.95rem;color:var(--muted)}
#ending .ghost-btn{width:100%;margin:12px 0 8px}
.rank-panel{max-width:520px;display:flex;flex-direction:column;gap:12px}
.rank-tabs{display:flex;gap:6px;justify-content:center}
.rank-tabs button{background:rgba(255,255,255,.08);border:1px solid var(--line);color:var(--paper);border-radius:999px;padding:8px 18px;font-family:var(--display);font-size:1rem}
.rank-tabs button.on{background:var(--warn);color:var(--paper-ink);border-color:transparent}
.rank-list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px;max-height:50vh;overflow-y:auto}
.rank-list li{display:grid;grid-template-columns:2.2em 1fr auto;gap:10px;align-items:center;background:rgba(255,255,255,.06);border-radius:12px;padding:10px 14px;font-variant-numeric:tabular-nums}
.rank-list li.me{background:rgba(255,207,74,.22);outline:2px solid var(--warn)}
.rank-list .r{font-family:var(--display);color:var(--warn);font-size:1.1rem}
.rank-list .n{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:1.1rem}
.rank-list .n small{color:var(--muted);margin-left:6px;font-size:.8rem}
.rank-list .s{font-family:var(--display);font-size:1.15rem}
.rank-list .empty{display:block;text-align:center;color:var(--muted)}
.rank-rule{margin:0;color:var(--muted);font-size:.85rem;word-break:keep-all}
.rule{background:#fffdf7;color:#1d2533;border-radius:18px;padding:22px 20px;min-height:150px;display:flex;flex-direction:column;justify-content:center;gap:8px}
.rule .no{font-family:var(--display);color:#0f7a55;font-size:1rem}
.rule p{margin:0;font-size:1.35rem;line-height:1.55;word-break:keep-all;font-family:var(--display);font-weight:400}
.rule small{color:#5e6b7d}
.pager{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:14px 0}
.pager button{background:rgba(255,255,255,.1);border:1px solid var(--line);color:var(--paper);border-radius:12px;padding:10px 16px;font-family:var(--display);font-size:1rem}
.pager button:disabled{opacity:.3}
.dots{display:flex;gap:5px;flex-wrap:wrap;justify-content:center;min-width:0}
.dots i{width:8px;height:8px;border-radius:50%;background:rgba(255,255,255,.25)}
.dots i.on{background:var(--warn)}

@media (max-width:520px){
  .txt{font-size:1.12rem}
  .opt{font-size:1.04rem;padding:13px 14px}
  .ava{width:58px;height:58px;font-size:1.2rem}
  #hud{flex-wrap:wrap}
  #prog{order:2;flex-basis:100%;width:auto;padding:6px 12px 8px}
  #prog .pl em{display:none}
  .nav .round{padding:8px 10px}
  .round .lbl{display:none}
}
@media (prefers-reduced-motion: reduce){
  .kb,.bobw.bob{animation:none}
  #stage.shake .bg,#stage.tremble .bg{animation:none}
  #wave.go{animation-duration:.01s}
  .opt,.panel,.card{animation:none}
}
</style>
</head>
<body>

<!-- ================= 화면 뼈대 (HTML) ================= -->
<div id="stage">
  <div class="bg" id="bgA"></div>
  <div class="bg" id="bgB"></div>
  <div id="vignette"></div>
  <div id="wave"></div>
  <div id="flash"></div>
</div>

<div id="hud" hidden>
  <div id="prog" aria-label="진행도">
    <div class="pl"><b id="chNum">1장</b><span id="chName">바닷가에 도착했어요</span><em id="chTotal"></em></div>
    <div class="pbar"><i id="pfill"></i><span class="ticks"></span></div>
  </div>
  <div class="hud-right">
    <div class="nav">
      <button class="round" id="backBtn" title="앞 대사 다시 보기" disabled>
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg><span class="lbl">뒤로</span></button>
      <button class="round" id="skipBtn" title="다음 선택지까지 건너뛰기">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M4 5l8 7-8 7zM12 5l8 7-8 7z"/></svg><span class="lbl">건너뛰기</span></button>
      <button class="round" id="restartBtn" title="다시 시작">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12a8 8 0 1 0 2.4-5.7"/><path d="M4 4v5h5"/></svg><span class="lbl">다시</span></button>
    </div>
    <div id="hearts" aria-label="남은 하트"></div>
    <button class="round" id="sndBtn" aria-pressed="true" title="효과음 켜기/끄기">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M4 9v6h4l5 4V5L8 9H4z" fill="currentColor"/><path class="w" d="M16 9a4 4 0 0 1 0 6M18.5 6.5a8 8 0 0 1 0 11"/></svg>
      <span class="lbl" id="sndLbl">소리 켬</span>
    </button>
  </div>
</div>

<div id="bottom">
  <div id="choices" hidden></div>
  <div id="dialog" hidden>
    <div class="ava" id="ava"></div>
    <div class="say">
      <div class="who" id="who"></div>
      <div class="dir" id="dir"></div>
      <div class="txt" id="txt"></div>
      <div class="next" id="next">눌러서 계속 ▶</div>
    </div>
  </div>
</div>

<!-- 시작 화면 (0장) -->
<div class="cover" id="start">
  <div class="ver">v1.2.0</div>
  <form class="panel" id="startForm" autocomplete="off">
    <div class="kicker" id="kicker"></div>
    <h1 id="gameTitle"></h1>
    <div class="field">
      <label for="nm">내 이름을 써 주세요</label>
      <input id="nm" maxlength="8" placeholder="예) 김하늘">
    </div>
    <div class="err" id="err"></div>
    <div class="row">
      <div class="field"><label>학교</label><input class="school" id="schoolShort" disabled></div>
      <div class="field"><label for="gr">학년</label><select id="gr"></select></div>
      <div class="field"><label for="cl">반</label><select id="cl"></select></div>
    </div>
    <button class="big-btn" type="submit">시작하기</button>
    <button class="ghost-btn" id="rankOpen1" type="button" style="width:100%;margin-top:10px">🏆 랭킹 보기</button>
  </form>
</div>

<div class="cover" id="chapter" hidden><div class="inner"><div class="n" id="chN"></div><div class="t" id="chT"></div><div class="s">자동 저장했어요</div></div></div>

<div class="cover" id="menu" hidden>
  <div class="panel menu-panel">
    <p class="fb-title" style="color:var(--paper)">어디서부터 다시 할까요?</p>
    <button class="big-btn" id="rsChapter">이 장 처음부터</button>
    <button class="big-btn red" id="rsGame">1장부터 다시 (하트 3개)</button>
    <button class="ghost-btn" id="rsCancel">계속하기</button>
  </div>
</div>

<div class="cover" id="feedback" hidden>
  <div class="panel">
    <div class="fb-heart" id="fbHeart"></div>
    <p class="fb-title">앗, 위험했어요!</p>
    <div class="lesson"><b>왜 위험했을까요?</b><span id="fbText"></span></div>
    <button class="big-btn" id="fbBtn">알겠어요, 계속할게요</button>
  </div>
</div>

<div class="cover" id="over" hidden>
  <div class="panel">
    <p class="fb-title">앗, 위험했어요!<br>다시 해볼까요?</p>
    <div class="lesson"><b>방금 배운 것</b><span id="overText"></span></div>
    <button class="big-btn red" id="overBtn">다시 하기</button>
  </div>
</div>

<div class="cover" id="cardBox" hidden></div>

<div class="cover" id="ending" hidden>
  <div class="panel">
    <svg class="medal" viewBox="0 0 100 100" aria-hidden="true"><path d="M30 4h14l6 22-12 6zM70 4H56l-6 22 12 6z" fill="#2d6cdf"/><circle cx="50" cy="60" r="34" fill="#ffcf4a"/><circle cx="50" cy="60" r="26" fill="#f2b51c"/><path d="M50 44l5 10 11 1.6-8 7.8 1.9 11L50 69l-9.9 5.4L42 63.4l-8-7.8L45 54z" fill="#fff6d0"/></svg>
    <p class="title-badge" id="badge"></p>
    <p class="who-line" id="whoLine"></p>
    <div class="score-box">
      <div class="score-big"><span id="scoreNum">0</span>점</div>
      <div class="score-parts" id="scoreParts"></div>
      <form class="nick-row" id="nickForm" autocomplete="off">
        <input id="nick" maxlength="8" placeholder="랭킹에 쓸 별명 (예: 파도왕)">
        <button class="big-btn" type="submit" id="nickBtn">랭킹에 올리기</button>
      </form>
      <div class="nick-msg" id="nickMsg"></div>
    </div>
    <div class="rule" id="rule"></div>
    <div class="pager"><button id="prevR">◀ 이전</button><div class="dots" id="dots"></div><button id="nextR">다음 ▶</button></div>
    <button class="ghost-btn" id="rankOpen2" type="button">🏆 랭킹 보기</button>
    <button class="big-btn" id="againBtn">처음부터 다시 하기</button>
  </div>
</div>

<!-- 랭킹 보드 -->
<div class="cover" id="rankBox" hidden>
  <div class="panel rank-panel">
    <p class="fb-title" style="color:var(--warn)">🏆 랭킹 보드</p>
    <div class="rank-tabs"><button id="tabClass" class="on" type="button">우리 반</button><button id="tabAll" type="button">전체</button></div>
    <ol class="rank-list" id="rankList"></ol>
    <p class="rank-rule">점수 = 기본 1000점 + 남은 하트 × 200점 − 틀린 횟수 × 100점 − 힌트 × 50점</p>
    <button class="big-btn" id="rankClose" type="button">닫기</button>
  </div>
</div>

<script src="story.js"></script>
<script src="engine.js"></script>

</body>
</html>
